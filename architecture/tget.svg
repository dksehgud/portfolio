<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <defs>
    <style>
      text {
        font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
        letter-spacing: 0;
      }
      .section-title { font-size: 16px; font-weight: 700; fill: #475569; }
      .node-title { font-size: 25px; font-weight: 700; fill: #0f172a; }
      .node-sub { font-size: 17px; font-weight: 600; fill: #475569; }
      .detail { font-size: 15px; font-weight: 500; fill: #64748b; }
      .chip { font-size: 14px; font-weight: 700; fill: #2563eb; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .client-card { fill: #ffffff; stroke: #93c5fd; stroke-width: 2.5; }
      .api-card { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .service-card { fill: #ecfdf5; stroke: #10b981; stroke-width: 2.5; }
      .mysql-card { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2.5; }
      .redis-card { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .data-flow { fill: none; stroke: #64748b; stroke-width: 3; marker-start: url(#arrow-back); marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <path d="M9,0 L9,6 L0,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="720" fill="#ffffff"/>

  <rect x="25" y="15" width="850" height="145" rx="8" class="group"/>
  <text x="50" y="45" class="section-title">CLIENT</text>
  <rect x="180" y="58" width="540" height="76" rx="8" class="client-card"/>
  <circle cx="228" cy="96" r="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="228" cy="90" r="7" fill="#3b82f6"/>
  <path d="M215 109 C219 99,237 99,241 109" fill="#3b82f6"/>
  <text x="272" y="91" class="node-title">사용자 · 예매 화면</text>
  <text x="272" y="119" class="node-sub">대기 진입과 현재 상태 확인</text>
  <rect x="548" y="75" width="69" height="26" rx="6" fill="#eff6ff"/>
  <text x="582.5" y="93" text-anchor="middle" class="chip">WAITING</text>
  <rect x="627" y="75" width="67" height="26" rx="6" fill="#ecfdf5"/>
  <text x="660.5" y="93" text-anchor="middle" class="chip" style="fill:#059669">ACTIVE</text>

  <rect x="25" y="185" width="850" height="300" rx="8" class="group"/>
  <text x="50" y="216" class="section-title">SPRING BOOT APPLICATION</text>
  <rect x="265" y="232" width="370" height="84" rx="8" class="api-card"/>
  <text x="450" y="268" text-anchor="middle" class="node-title">Queue / Ticket API</text>
  <text x="450" y="296" text-anchor="middle" class="node-sub">토큰 발급 · 대기 상태 조회</text>
  <rect x="200" y="345" width="500" height="120" rx="8" class="service-card"/>
  <text x="450" y="383" text-anchor="middle" class="node-title">Queue Service</text>
  <text x="450" y="412" text-anchor="middle" class="node-sub">대기 순서와 입장 상태 관리</text>
  <rect x="337" y="426" width="65" height="25" rx="6" fill="#ffffff"/>
  <text x="369.5" y="444" text-anchor="middle" class="detail">WAITING</text>
  <rect x="410" y="426" width="58" height="25" rx="6" fill="#ffffff"/>
  <text x="439" y="444" text-anchor="middle" class="detail">ACTIVE</text>
  <rect x="476" y="426" width="63" height="25" rx="6" fill="#ffffff"/>
  <text x="507.5" y="444" text-anchor="middle" class="detail">EXPIRED</text>

  <path d="M450 134 V232" class="flow"/>
  <text x="468" y="181" class="detail">요청 · 응답</text>
  <path d="M450 316 V345" class="flow"/>

  <rect x="25" y="510" width="850" height="195" rx="8" class="group"/>
  <text x="50" y="542" class="section-title">DATA</text>
  <rect x="125" y="560" width="280" height="115" rx="8" class="mysql-card"/>
  <text x="265" y="599" text-anchor="middle" class="node-title">MySQL</text>
  <text x="265" y="628" text-anchor="middle" class="node-sub">QueueToken</text>
  <text x="265" y="654" text-anchor="middle" class="detail">대기 상태 · 순서 · 만료</text>
  <rect x="495" y="560" width="280" height="115" rx="8" class="redis-card"/>
  <text x="635" y="599" text-anchor="middle" class="node-title">Redis</text>
  <text x="635" y="628" text-anchor="middle" class="node-sub">ACTIVE count</text>
  <text x="635" y="654" text-anchor="middle" class="detail">heartbeat · 접속 상태</text>

  <path d="M360 465 V505 H265 V560" class="data-flow"/>
  <path d="M540 465 V505 H635 V560" class="data-flow"/>
</svg>
